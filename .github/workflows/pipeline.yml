# ============================================================================
# CI/CD PIPELINE — Lab 27 version
#
# Path is fixed and case-sensitive:  .github/workflows/pipeline.yml
# GitHub discovers workflows there and nowhere else.
#
# THIS FILE GROWS. Lab 27 gives it one job. Later labs add to the same file:
#   Lab 28  pytest into this job, plus a 'security' job and the 'needs:' gate
#   Lab 29  the 'build' job — buildx, layer cache, SBOM, provenance
#   Lab 30  push to GHCR with an immutable sha- tag, plus Trivy
#   Lab 31  'deploy-dev' and 'deploy-prod', gated on oc rollout status
# ============================================================================
name: CI/CD

# WHEN this runs. Each trigger earns its place:
#   push to main       the integration branch
#   tags v*            a semver tag is the production release signal (Lab 31)
#   pull_request       validate BEFORE merge — the point of a PR gate
#   workflow_dispatch  manual run from the Actions tab, for re-runs
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least privilege for the automatically-minted GITHUB_TOKEN. That token is a
# live credential with access to this repository, so start closed — later jobs
# opt in to more (packages: write in Lab 30).
permissions:
  contents: read

# A newer push to the same branch cancels the older in-flight run.
# Not just a cost saving: without it two runs race, and an OLDER commit can
# finish last and deploy over a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # TEST — fast feedback, produces no artefacts.
  #
  # The job ID stays 'test' even though it only lints today. Labs 29-31 refer
  # to it as `needs: [test, security]`, so keeping the ID means the unit-test
  # step can be added in Lab 28 without editing anything downstream.
  #
  # Ordering rule: cheapest and most likely to fail goes first. Lint is 10
  # seconds, a build is minutes.
  # --------------------------------------------------------------------------
  test:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      # The runner starts EMPTY. Nothing is checked out until you say so, and
      # it only ever sees files you have COMMITTED — not what is on your Mac.
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # We have two requirements files; name both so the cache key changes
          # when either does. Without this, a dev-dependency bump reuses a
          # stale cache.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Two separate steps, not one combined command, so the Actions UI tells
      # you WHICH check failed without opening a log.
      - name: Lint
        run: ruff check app

      - name: Type check
        run: mypy app --ignore-missing-imports

      # ----------------------------------------------------------------------
      # LAB 28 ADDS THE UNIT TESTS HERE:
      #
      #   - name: Unit tests
      #     run: pytest tests/ -v --cov=app --cov-report=term-missing
      #
      # and widens the lint path to cover them:
      #
      #   - run: ruff check app tests
      #
      # Until then this job proves the code is clean and typed — it does NOT
      # prove the code works. That distinction is the whole point of Lab 28,
      # and of the `needs:` gate that follows it.
      # ----------------------------------------------------------------------
