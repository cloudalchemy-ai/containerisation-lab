# ============================================================================
# CI/CD PIPELINE — Lab 31 version  (Lab 28 still skipped)
#
# Path is fixed and case-sensitive:  .github/workflows/pipeline.yml
#
# WHAT CHANGED FROM YOUR LAB 30 FILE — the build job is untouched. Everything
# new is at the bottom:
#   1. a new `deploy-dev` job    — needs: [build], main branch AND v* tags
#   2. a new `deploy-prod` job   — needs: [deploy-dev], v* tags only
#   3. nothing else moved. The digest `outputs:` your Lab 30 file already
#      exposed is finally consumed — that is what it was put there for.
#
# THREE SECRETS TO ADD FIRST  (Settings -> Secrets and variables -> Actions):
#   OPENSHIFT_TOKEN      oc create token gh-deployer -n "$NS" --duration=8760h
#   OPENSHIFT_SERVER     oc whoami --show-server
#   OPENSHIFT_NAMESPACE  oc project -q          <-- on the Developer Sandbox
#                                                   this is <username>-dev,
#                                                   NOT containerisation-lab-dev
#
# THREE THINGS THAT MUST ALREADY EXIST IN THE NAMESPACE (you made them in
# Labs 14 and 19 — the pipeline deliberately does NOT create them):
#   secret/containerisation-lab-secret   deployment.yaml mounts it via envFrom;
#                                        without it Pods sit in
#                                        CreateContainerConfigError
#   secret/ghcr-pull                     your GHCR package is private
#   `oc secrets link default ghcr-pull --for=pull`
#
# STILL TO COME
#   Lab 28  the tests, and the 'security' job -> needs: [test, security]
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --------------------------------------------------------------------------
  # TEST — unchanged from Lab 27.
  # --------------------------------------------------------------------------
  test:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app

      - name: Type check
        run: python -m mypy app --ignore-missing-imports

      # Lab 28 adds:  python -m pytest tests/ -v --cov=app
      # and widens the lint to: python -m ruff check app tests

  # --------------------------------------------------------------------------
  # BUILD — unchanged from Lab 30. Builds, scans, pushes and signs.
  # --------------------------------------------------------------------------
  build:
    name: Build, scan, push & sign
    runs-on: ubuntu-latest
    needs: [test]

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    # The digest is what deploy-dev consumes below. A tag is a label someone
    # can move; a digest is the content itself.
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # exit-code: '1'   <-- enable to BLOCK the release on a CRITICAL/HIGH.

      - name: Upload scan results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Show what was published
        run: |
          echo "digest: ${{ steps.push.outputs.digest }}"
          echo "tags:"
          echo "${{ steps.meta.outputs.tags }}"

  # ==========================================================================
  # NEW IN LAB 31 — DEPLOY TO DEV
  #
  # Everything below this line is the addition. Read the four steps in order;
  # each one exists because of a specific way deployments lie to you.
  # ==========================================================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: [build]

    # Main OR a release tag. A feature branch builds and publishes an image
    # (so you can pull and try it) but never touches the cluster.
    #
    # THE TAG HALF IS NOT OPTIONAL. deploy-prod declares `needs: deploy-dev`,
    # and in GitHub Actions a job whose dependency was SKIPPED is itself
    # skipped. With `main` alone here, pushing v1.0.0 would skip deploy-dev,
    # which would silently skip deploy-prod — a release that quietly does
    # nothing and still shows a green tick. Including tags means a tag deploys
    # DEV first, and PROD promotes what DEV just validated.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    # No extra permissions. This job talks to OpenShift with a ServiceAccount
    # token from repo secrets — it needs nothing from GitHub beyond the source.
    permissions:
      contents: read

    # GitHub records a deployment against this environment and shows the URL
    # on the repo home page. Configure protection rules under
    # Settings -> Environments if you want approvals on DEV too.
    environment:
      name: dev
      url: ${{ steps.route.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      # ----------------------------------------------------------------------
      # STEP 1 — authenticate as the ServiceAccount, never as you.
      #
      # A pipeline that logs in as a human attributes every automated change to
      # that person, and the credential outlives their employment. gh-deployer
      # holds `edit` in exactly one namespace and nothing at cluster scope.
      # ----------------------------------------------------------------------
      # ----------------------------------------------------------------------
      # STEP 0 — fail fast, and say WHICH secret is missing.
      #
      # An unset secret expands to an empty string. Without this step the first
      # symptom is `error: A server URL must be specified` from oc, which does
      # not tell you that a secret is missing, let alone which one.
      #
      # Reading them through `env:` rather than inline is deliberate: it keeps
      # the values out of the rendered command line in the log.
      #
      # HOW TO SPOT THIS IN A LOG: GitHub masks every non-empty secret as ***.
      # If you see --token="" with nothing between the quotes, the secret does
      # not exist. If you see --token="***", it exists and something else is
      # wrong.
      # ----------------------------------------------------------------------
      - name: Check the deploy secrets exist
        env:
          OC_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OC_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OC_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          missing=""
          [ -n "$OC_TOKEN" ]     || missing="$missing OPENSHIFT_TOKEN"
          [ -n "$OC_SERVER" ]    || missing="$missing OPENSHIFT_SERVER"
          [ -n "$OC_NAMESPACE" ] || missing="$missing OPENSHIFT_NAMESPACE"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            echo ""
            echo "Add them under Settings -> Secrets and variables -> Actions"
            echo "-> Repository secrets. Get the values with:"
            echo "  OPENSHIFT_TOKEN      oc create token gh-deployer -n \"\$NS\" --duration=8760h"
            echo "  OPENSHIFT_SERVER     oc whoami --show-server"
            echo "  OPENSHIFT_NAMESPACE  oc project -q"
            echo ""
            echo "They must be SECRETS, not Variables. secrets.X cannot read a variable."
            exit 1
          fi
          echo "all three deploy secrets are present"

      - name: Log in to OpenShift
        env:
          OC_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OC_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OC_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          oc login --token="$OC_TOKEN" --server="$OC_SERVER"
          oc project "$OC_NAMESPACE"
          echo "acting as : $(oc whoami)"
          echo "namespace : $(oc project -q)"

      # ----------------------------------------------------------------------
      # STEP 2 — apply the manifests, with the image substituted in.
      #
      # WHY SUBSTITUTE RATHER THAN `oc apply` THEN `oc set image`:
      # openshift/deployment.yaml carries the `replace-me` placeholder from
      # Lab 14. Applying it as-is would create a ReplicaSet that immediately
      # fails with InvalidImageName, and only then would `oc set image` correct
      # it. Harmless in the end, but it puts a scary event in the namespace and
      # muddies `oc rollout status`. Substituting first means only one
      # ReplicaSet is ever created, and it is the right one.
      #
      # WHY BY DIGEST, NOT BY TAG: a tag is a pointer someone can repoint; a
      # digest IS the content. Deploying by digest is the strongest form of the
      # reproducibility argument — the bytes that were tested, scanned and
      # signed are provably the bytes that run. (Lab 31's prose shows the
      # `sha-<commit>` tag form, which is one step weaker and easier to read in
      # `oc get pods -o wide`; either is defensible, digest is stricter.)
      #
      # WHAT IS DELIBERATELY NOT APPLIED:
      #   secret-example.yaml  — a TEMPLATE. Applying it would overwrite your
      #                          real Secret with example values.
      #   networkpolicy.yaml   — Phase 22 material; applying default-deny here
      #                          would cut the Route off mid-lab.
      #   hpa.yaml             — would fight `replicas:` in the Deployment.
      # ----------------------------------------------------------------------
      - name: Apply manifests with the new image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "deploying image: $IMAGE"

          oc apply -f openshift/configmap.yaml
          oc apply -f openshift/service.yaml
          oc apply -f openshift/routes.yaml

          # ------------------------------------------------------------------
          # Replace whatever image the manifest names with the one we just
          # built. Do NOT grep for a particular placeholder: Lab 14 tells you
          # to put your own GHCR path there, so the placeholder is gone by the
          # time this ever runs.
          #
          # Instead: require EXACTLY ONE image: line, substitute it, and then
          # verify the result. That is independent of what the file says today
          # and it still refuses to deploy something it does not understand.
          # ------------------------------------------------------------------
          n=$(grep -c '^[[:space:]]*image:' openshift/deployment.yaml || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly 1 'image:' line in openshift/deployment.yaml, found $n"
            echo "--- the file as committed ---"
            cat -n openshift/deployment.yaml
            exit 1
          fi

          sed -E "s|^([[:space:]]*image:[[:space:]]*).*|\1${IMAGE}|" \
            openshift/deployment.yaml > /tmp/deployment.rendered.yaml

          grep -q "image: ${IMAGE}" /tmp/deployment.rendered.yaml \
            || { echo "::error::image substitution did not take"; exit 1; }

          # A Deployment with no containers: block is accepted by a YAML parser
          # and rejected by the API server with a confusing message. Catch it
          # here, where the error can name the actual problem.
          grep -q '^[[:space:]]*containers:' /tmp/deployment.rendered.yaml \
            || { echo "::error::openshift/deployment.yaml has no containers: block — the file is incomplete"; exit 1; }

          oc apply -f /tmp/deployment.rendered.yaml

      # ----------------------------------------------------------------------
      # STEP 3 — THE GATE.
      #
      # Without this the job goes green the instant the API call returns —
      # long before any Pod is serving. A green pipeline over a broken
      # deployment is worse than a red one, because it removes the signal you
      # were relying on. This is the single most commonly omitted line in
      # deployment pipelines.
      #
      # It can return non-zero rather than hang because deployment.yaml sets
      # progressDeadlineSeconds: 120 (Lab 25). The timeout here is deliberately
      # LARGER than that deadline, so you get a real rollout failure rather
      # than an ambiguous client-side timeout.
      # ----------------------------------------------------------------------
      - name: Wait for the rollout
        run: oc rollout status deployment/containerisation-lab --timeout=180s

      # Diagnostics, only when something went wrong. Printing events and the
      # previous container's logs here saves the round trip of logging into the
      # cluster to find out why.
      - name: Explain the failure
        if: failure()
        run: |
          oc get pods -o wide || true
          oc describe deployment/containerisation-lab | tail -30 || true
          oc get events --sort-by=.lastTimestamp | tail -30 || true
          oc logs deployment/containerisation-lab --previous --tail=50 || true

      # ----------------------------------------------------------------------
      # STEP 4 — automatic rollback.
      #
      # `if: failure()` makes recovery a property of the system rather than of
      # who is on call. The trailing `exit 1` keeps the job RED: a silent
      # self-heal is how a recurring fault stays invisible for months.
      # ----------------------------------------------------------------------
      - name: Roll back if the rollout failed
        if: failure()
        run: |
          oc rollout undo deployment/containerisation-lab
          oc rollout status deployment/containerisation-lab --timeout=180s
          echo "::error::rollout failed and was rolled back"
          exit 1

      # ----------------------------------------------------------------------
      # STEP 5 — smoke test through the REAL Route.
      #
      # Pods being Ready proves the probes pass. It says nothing about the
      # Route, the TLS certificate, DNS, or a NetworkPolicy. Only a request
      # through the public front door proves those.
      #
      # -k because the Sandbox's wildcard certificate will not validate against
      # a bare curl in some runners. On a cluster with a proper certificate,
      # drop the -k — and if it then fails, that is a finding, not a nuisance.
      # ----------------------------------------------------------------------
      - name: Capture the Route URL
        id: route
        run: |
          HOST=$(oc get route containerisation-lab -o jsonpath='{.spec.host}')
          [ -n "$HOST" ] || { echo "::error::Route has no host yet"; exit 1; }
          echo "url=https://${HOST}" >> "$GITHUB_OUTPUT"
          echo "route: https://${HOST}"

      - name: Smoke test through the Route
        run: |
          URL="${{ steps.route.outputs.url }}"
          code=000
          for i in $(seq 1 10); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$URL/health" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $i: got $code, retrying in 5s"
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::smoke test FAILED ($code)"; exit 1; }
          echo "smoke test passed"

      # ----------------------------------------------------------------------
      # STEP 6 — prove the running image is the one this commit produced.
      #
      # This is the assertion the whole pipeline exists to make true. It costs
      # two lines and turns "we deploy from CI" from a claim into evidence.
      # ----------------------------------------------------------------------
      - name: Assert the running image is the one we just built
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          RUNNING=$(oc get deploy containerisation-lab \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "expected: $IMAGE"
          echo "running : $RUNNING"
          [ "$RUNNING" = "$IMAGE" ] || { echo "::error::image mismatch"; exit 1; }

  # ==========================================================================
  # NEW IN LAB 31 — PROMOTE TO PROD
  #
  # ON THE DEVELOPER SANDBOX YOU HAVE NO PROD. Two honest options:
  #   a) point OPENSHIFT_NAMESPACE_PROD at your <username>-stage namespace and
  #      treat it as the second environment; or
  #   b) delete this job.
  # Either way it never runs during normal work — it fires only on a v* tag.
  # ==========================================================================
  deploy-prod:
    name: Promote to PROD
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]

    # A semver tag is the release signal. Merging to main deploys DEV; only
    # tagging releases PROD.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read

    # Configure REQUIRED REVIEWERS on this environment in
    # Settings -> Environments -> prod.
    #
    # That approval is enforced by the platform, not by convention — which is
    # what makes it an auditable segregation-of-duties control rather than a
    # team habit. A checklist in a wiki is not a control.
    environment:
      name: prod

    steps:
      - uses: actions/checkout@v4

      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Log in to OpenShift
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN_PROD }}" \
                   --server="${{ secrets.OPENSHIFT_SERVER_PROD }}"
          oc project "${{ secrets.OPENSHIFT_NAMESPACE_PROD }}"

      # NOTE WHAT IS NOT HERE: a rebuild.
      #
      # The SAME image — the same digest — that passed every check above is
      # promoted unchanged. Rebuilding for production would produce different
      # bytes than the ones that were tested, scanned and signed, silently
      # invalidating the entire chain of evidence. This is Lab 17's "one image,
      # promoted unchanged" arriving at its conclusion.
      - name: Promote the identical image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          oc apply -f openshift/configmap.yaml
          oc apply -f openshift/service.yaml
          oc apply -f openshift/routes.yaml
          sed "s|image: ghcr.io/replace-me/containerisation-lab:1.0.0|image: ${IMAGE}|" \
            openshift/deployment.yaml | oc apply -f -
          oc rollout status deployment/containerisation-lab --timeout=300s

      - name: Roll back if the rollout failed
        if: failure()
        run: |
          oc rollout undo deployment/containerisation-lab
          oc rollout status deployment/containerisation-lab --timeout=300s
          echo "::error::PROD rollout failed and was rolled back"
          exit 1

      - name: Smoke test PROD through the Route
        run: |
          HOST=$(oc get route containerisation-lab -o jsonpath='{.spec.host}')
          code=000
          for i in $(seq 1 10); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://${HOST}/health" || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::PROD smoke test FAILED ($code)"; exit 1; }