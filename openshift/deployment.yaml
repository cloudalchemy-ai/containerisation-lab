apiVersion: apps/v1
kind: Deployment
metadata:
  name: containerisation-lab
  labels:
    app: containerisation-lab
    app.kubernetes.io/name: containerisation-lab
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: containerisation-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: containerisation-lab
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: containerisation-lab
        app.kubernetes.io/name: containerisation-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      
      
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: containerisation-lab-config
            - secretRef:
                name: containerisation-lab-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}